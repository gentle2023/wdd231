<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles/thankyou.css">
<title>Thank You</title>
</head>

<body>

<main>
<h1>Thank You for Joining!</h1>
<p class="thankyou-message">
Your membership application has been received.
</p>
<div id="results"></div>
<a href="index.html" class="home-btn">Return Home</a>

</main>
<script>

const params = new URLSearchParams(window.location.search);

document.getElementById("results").innerHTML = `
<p><strong>First Name:</strong> ${params.get("fname")}</p>
<p><strong>Last Name:</strong> ${params.get("lname")}</p>
<p><strong>Email:</strong> ${params.get("email")}</p>
<p><strong>Mobile:</strong> ${params.get("phone")}</p>
<p><strong>Organization:</strong> ${params.get("organization")}</p>
<p><strong>Date Submitted:</strong> ${params.get("timestamp")}</p>
`;

</script>

</body>
</html>
