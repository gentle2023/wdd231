  <link rel="stylesheet" href="styles/small.css">

<body>
<!--Header and Navigation-->
<header class="navbar">
  <div class="navbar-container">
    
    <!-- LOGO -->

      <img src="images/librilog-logo.png" alt="Logo">

        <h1>LIBRILOG</h1>

    </div>

    <!-- HAMBURGER -->

<main>
        <section class="list-header">
            <h2>Your Saved Books</h2>
            <p id="list-count">You have 0 books in your list.</p>
        </section>
        
        <div id="reading-list-grid" class="book-grid">
            </div>

        <div id="empty-message" class="hidden">
            <p>Your list is currently empty. Visit the <a href="library.html">Library</a> to add some books!</p>
